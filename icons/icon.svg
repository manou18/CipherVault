<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="192" height="192">
  <defs>
    <!-- مطابقة تدرج الخلفية في الموقع -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#121826" />
      <stop offset="100%" stop-color="#0a0f1c" />
    </radialGradient>
  </defs>
  
  <!-- إطار الأيقونة -->
  <rect width="192" height="192" rx="112" fill="url(#bgGrad)" stroke="#232b3d" stroke-width="12" />
  
  <!-- مكعب البيانات ثلاثي الأبعاد (يمثل كتلة تشفير AES-GCM) -->
  <g transform="translate(0, 10)">
      <!-- الوجه العلوي (أزرق - يمثل فك التشفير) -->
      <polygon points="256,120 370,185 256,250 142,185" fill="#1c2f52" stroke="#4c8bf5" stroke-width="8" stroke-linejoin="round"/>
      
      <!-- الوجه الأيسر (أخضر - يمثل التشفير) -->
      <polygon points="142,185 256,250 256,380 142,315" fill="#12261c" stroke="#3fbf83" stroke-width="8" stroke-linejoin="round"/>
      
      <!-- الوجه الأيمن (ذهبي - يمثل توليد المفاتيح) -->
      <polygon points="256,250 370,185 370,315 256,380" fill="#4a3d21" stroke="#d6a94d" stroke-width="8" stroke-linejoin="round"/>
      
      <!-- النواة المركزية للبيانات -->
      <circle cx="256" cy="250" r="28" fill="#edf1f7" />
      <circle cx="256" cy="250" r="12" fill="#0a0f1c" />
      
      <!-- مسارات البيانات -->
      <line x1="256" y1="250" x2="256" y2="120" stroke="#edf1f7" stroke-width="6" stroke-dasharray="10 6" />
      <line x1="256" y1="250" x2="142" y2="315" stroke="#edf1f7" stroke-width="6" stroke-dasharray="10 6" />
      <line x1="256" y1="250" x2="370" y2="315" stroke="#edf1f7" stroke-width="6" stroke-dasharray="10 6" />
  </g>
</svg>